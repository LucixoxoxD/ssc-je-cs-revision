<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Revision | SSC JE Revision Portal</title>

  <!-- Prevent theme flicker (FOUC) -->
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      const saved = localStorage.getItem('ssc_je_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- KaTeX for Clean Mathematics Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Offline Script-tag Fallback Data for file:// execution -->
  <script src="data/subjects.js"></script>
  <script src="data/os.js"></script>
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-link" aria-label="SSC JE Revision Portal Home">
        <span class="brand-badge">SSC JE</span>
        <div class="brand-title">
          <span class="brand-title-main">CS & IT Revision</span>
          <span class="brand-title-sub">Junior Engineer Syllabus</span>
        </div>
      </a>

      <div class="header-nav">
        <a href="index.html" class="nav-btn" title="Back to All Subjects">
          <span class="icon">🏠</span>
          <span>Subjects</span>
        </a>
        <a href="bookmarks.html" class="nav-btn" title="View Bookmarked Topics">
          <span class="icon">⭐</span>
          <span>Bookmarks</span>
          <span id="nav-bookmark-count" class="bookmark-counter-badge" style="display: none;">0</span>
        </a>
        <button class="theme-toggle-btn" type="button" aria-label="Toggle light or dark theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <article class="topic-container" id="topic-content-wrapper">
        <div style="text-align: center; padding: 4rem 1rem;">
          Loading revision notes...
        </div>
      </article>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>SSC JE (CS & IT) Revision Portal</strong> &bull; Complete self-study & revision guide
      </div>
      <div>
        <a href="index.html">← Back to Subjects Overview</a>
      </div>
    </div>
  </footer>

  <!-- Application Logic Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/topic-renderer.js"></script>

  <!-- Page Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Refresh bookmarks counter in header
      if (window.updateHeaderBookmarkCount) {
        window.updateHeaderBookmarkCount();
      }

      // 2. Parse URL parameters (?id=<subject-id>/<topic-id> or ?subject=os&topic=process-management)
      const urlParams = new URLSearchParams(window.location.search);
      let subjectId = null;
      let topicId = null;

      const rawId = urlParams.get('id');
      if (rawId && rawId.includes('/')) {
        const parts = rawId.split('/');
        subjectId = parts[0];
        topicId = parts[1];
      } else if (rawId) {
        // Fallback if only id provided
        subjectId = rawId;
        topicId = urlParams.get('topic');
      } else {
        subjectId = urlParams.get('subject');
        topicId = urlParams.get('topic');
      }

      const container = document.getElementById('topic-content-wrapper');

      if (!subjectId || !topicId) {
        container.innerHTML = `
          <div class="coming-soon-container">
            <div class="coming-soon-icon">⚠️</div>
            <h1 class="coming-soon-title">No Topic Specified</h1>
            <p class="coming-soon-desc">Please choose a topic from a subject syllabus page.</p>
            <a href="index.html" class="nav-btn">Browse All Subjects</a>
          </div>
        `;
        return;
      }

      try {
        const subject = await window.DataLoader.getSubject(subjectId);
        if (!subject) {
          throw new Error(`Subject "${subjectId}" not found.`);
        }

        const topic = (subject.topics || []).find(t => t.id === topicId);
        if (!topic) {
          throw new Error(`Topic "${topicId}" not found in subject "${subject.title}".`);
        }

        document.title = `${topic.title} | ${subject.title} Revision | SSC JE`;
        window.TopicRenderer.render(container, subject, topic);

      } catch (err) {
        console.error('Failed to load topic:', err);
        container.innerHTML = `
          <div class="coming-soon-container">
            <div class="coming-soon-icon">⚠️</div>
            <h1 class="coming-soon-title">Topic Loading Error</h1>
            <p class="coming-soon-desc">${err.message}</p>
            <div style="display: flex; gap: 0.75rem; justify-content: center;">
              <a href="subject.html?id=${subjectId || ''}" class="nav-btn">View Subject Syllabus</a>
              <a href="index.html" class="nav-btn">Return to Home</a>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
