<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Topics | SSC JE Revision Portal</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M28 36 L50 22 L72 36 L50 49 Z' fill='%23ffffff'/%3E%3Cpath d='M50 49 L50 78' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 47 L32 66 Q50 78 68 66 L68 47' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='75' cy='52' r='4' fill='%2338bdf8'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg">

  <!-- Prevent theme flicker (FOUC) -->
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      const saved = localStorage.getItem('ssc_je_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Offline Script-tag Fallback Data for file:// execution -->
  <script src="data/subjects.js"></script>
  <script src="data/os.js"></script>
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-link" aria-label="SSC JE Revision Portal Home">
        <span class="brand-badge">SSC JE</span>
        <div class="brand-title">
          <span class="brand-title-main">CS & IT Revision</span>
          <span class="brand-title-sub">Junior Engineer Syllabus</span>
        </div>
      </a>

      <div class="header-nav">
        <a href="index.html" class="nav-btn" title="Back to All Subjects">
          <span class="icon">🏠</span>
          <span>Subjects</span>
        </a>
        <a href="bookmarks.html" class="nav-btn" title="View Bookmarked Topics">
          <span class="icon">⭐</span>
          <span>Bookmarks</span>
          <span id="nav-bookmark-count" class="bookmark-counter-badge" style="display: none;">0</span>
        </a>
        <button class="theme-toggle-btn" type="button" aria-label="Toggle light or dark theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" id="subject-container">
      <div style="text-align: center; padding: 3rem;">
        Loading subject syllabus...
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>SSC JE (CS & IT) Revision Portal</strong> &bull; Complete self-study & revision guide
      </div>
      <div>
        <a href="index.html">← Back to All Subjects</a>
      </div>
    </div>
  </footer>

  <!-- Application Logic Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data-loader.js"></script>

  <!-- Page Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Refresh bookmarks count
      function refreshBookmarksCount() {
        const count = window.StorageManager.getBookmarks().length;
        const badge = document.getElementById('nav-bookmark-count');
        if (badge) {
          badge.textContent = count;
          badge.style.display = count > 0 ? 'inline-flex' : 'none';
        }
      }
      refreshBookmarksCount();
      window.addEventListener('bookmarks-changed', refreshBookmarksCount);

      // Get subject ID from URL params (?id=<subject-id>)
      const urlParams = new URLSearchParams(window.location.search);
      const subjectId = urlParams.get('id');

      const container = document.getElementById('subject-container');

      if (!subjectId) {
        container.innerHTML = `
          <div class="coming-soon-container">
            <div class="coming-soon-icon">⚠️</div>
            <h1 class="coming-soon-title">No Subject Specified</h1>
            <p class="coming-soon-desc">Please choose a subject from the home page.</p>
            <a href="index.html" class="nav-btn">Go to Subjects List</a>
          </div>
        `;
        return;
      }

      try {
        const subject = await window.DataLoader.getSubject(subjectId);
        renderSubjectPage(subject);

        // Listen for progress updates
        window.addEventListener('progress-changed', () => {
          renderSubjectPage(subject);
        });
      } catch (err) {
        console.error('Failed to load subject data:', err);
        container.innerHTML = `
          <div class="coming-soon-container">
            <div class="coming-soon-icon">⚠️</div>
            <h1 class="coming-soon-title">Subject Not Found</h1>
            <p class="coming-soon-desc">Could not load syllabus data for subject ID: "${escapeHtml(subjectId)}".</p>
            <a href="index.html" class="nav-btn">Return to Home</a>
          </div>
        `;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderSubjectPage(subject) {
        document.title = `${subject.title} Topics | SSC JE Revision`;

        const progress = window.StorageManager.getSubjectProgress(subject.id, subject.topics);
        const orderStr = String(subject.order || '').padStart(2, '0');

        let html = `
          <!-- Breadcrumb Navigation -->
          <nav class="breadcrumb-nav" aria-label="Breadcrumb">
            <ul class="breadcrumb-list">
              <li class="breadcrumb-item"><a href="index.html">Subjects</a></li>
              <li class="breadcrumb-separator">/</li>
              <li class="breadcrumb-current">${subject.title}</li>
            </ul>
          </nav>

          <!-- Subject Banner -->
          <section class="subject-banner">
            <div class="subject-banner-top">
              <div class="subject-banner-icon" aria-hidden="true">${subject.icon || '📚'}</div>
              <div class="subject-banner-content">
                <div class="subject-banner-meta">
                  <span class="subject-order-pill">Subject #${orderStr}</span>
                </div>
                <h1 class="subject-banner-title">${subject.title}</h1>
                <p class="subject-banner-desc">${subject.description || ''}</p>
              </div>
            </div>

            <!-- Subject Progress Bar -->
            <div class="overall-progress-card" style="padding: 1.15rem 1.4rem;">
              <div class="progress-header">
                <span class="progress-label" style="font-size: 0.875rem;">
                  <span>📊</span> Subject Revision Progress
                </span>
                <span class="progress-meta">${progress.percent}% (${progress.revised} / ${progress.total} topics revised)</span>
              </div>
              <div class="progress-bar-track" style="height: 0.55rem;">
                <div class="progress-bar-fill" style="width: ${progress.percent}%;"></div>
              </div>
            </div>
          </section>

          <!-- Syllabus Topics List Section -->
          <section aria-labelledby="topics-heading">
            <div class="section-title-wrap">
              <h2 id="topics-heading" class="section-title">Syllabus Topics (${subject.topics ? subject.topics.length : 0})</h2>
              <span class="section-subtext">Official Exam Scope</span>
            </div>

            <div class="topics-list-container">
              ${(subject.topics || []).map((topic, idx) => {
                const topicIndexStr = String(idx + 1).padStart(2, '0');
                const isReady = topic.status === 'done' || topic.status === 'ready';
                const isRevised = window.StorageManager.isRevised(subject.id, topic.id);
                const isBookmarked = window.StorageManager.isBookmarked(subject.id, topic.id);
                const topicUrl = `topic.html?id=${subject.id}/${topic.id}`;

                return `
                  <article class="topic-item-card ${isRevised ? 'is-revised' : ''}">
                    <div class="topic-item-left">
                      <div class="topic-index-badge">${topicIndexStr}</div>
                      <div class="topic-item-meta">
                        <div class="topic-item-title-row">
                          <a href="${topicUrl}" class="topic-item-title-link">
                            <span>${topic.title}</span>
                          </a>
                          <span class="status-badge ${isReady ? 'ready' : 'coming-soon'}">
                            ${isReady ? 'Ready' : 'Pending'}
                          </span>
                        </div>
                        ${topic.syllabus ? `
                          <p class="topic-item-syllabus">
                            ${escapeHtml(topic.syllabus)}
                          </p>
                        ` : ''}
                      </div>
                    </div>

                    <div class="topic-item-actions">
                      <label class="checkbox-label" title="Mark this topic as revised">
                        <input 
                          type="checkbox" 
                          class="topic-revise-checkbox" 
                          data-subjectid="${subject.id}" 
                          data-topicid="${topic.id}" 
                          ${isRevised ? 'checked' : ''}
                        >
                        <span>${isRevised ? 'Revised ✓' : 'Mark revised'}</span>
                      </label>

                      <button 
                        class="btn-icon-action ${isBookmarked ? 'bookmarked' : ''} topic-bookmark-btn" 
                        data-subjectid="${subject.id}" 
                        data-topicid="${topic.id}" 
                        data-topictitle="${escapeHtml(topic.title)}" 
                        data-subjecttitle="${escapeHtml(subject.title)}" 
                        data-subjecticon="${subject.icon || '📌'}"
                        title="${isBookmarked ? 'Remove Bookmark' : 'Bookmark Topic'}"
                        type="button"
                      >
                        ${isBookmarked ? '★' : '☆'}
                      </button>

                      <a href="${topicUrl}" class="btn-study-action">
                        <span>${isReady ? 'Revise' : 'View'}</span>
                        <span class="arrow">→</span>
                      </a>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          </section>
        `;

        container.innerHTML = html;

        // Attach listeners for revise checkboxes
        container.querySelectorAll('.topic-revise-checkbox').forEach(cb => {
          cb.addEventListener('change', (e) => {
            const sid = e.target.dataset.subjectid;
            const tid = e.target.dataset.topicid;
            window.StorageManager.setRevised(sid, tid, e.target.checked);
          });
        });

        // Attach listeners for bookmark buttons
        container.querySelectorAll('.topic-bookmark-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const btnEl = e.currentTarget;
            const sid = btnEl.dataset.subjectid;
            const tid = btnEl.dataset.topicid;
            const title = btnEl.dataset.topictitle;
            const subjectTitle = btnEl.dataset.subjecttitle;
            const icon = btnEl.dataset.subjecticon;

            const isSaved = window.StorageManager.toggleBookmark({
              subjectId: sid,
              topicId: tid,
              title: title,
              subjectTitle: subjectTitle,
              icon: icon
            });

            btnEl.classList.toggle('bookmarked', isSaved);
            btnEl.textContent = isSaved ? '★' : '☆';
            btnEl.title = isSaved ? 'Remove Bookmark' : 'Bookmark Topic';
          });
        });
      }
    });
  </script>
</body>
</html>
